# Windows 어댑터 빌드와 검증.
#
# 여기서 도는 것은 셋이다.
#
#   1. MSVC 가 이 코드를 `/W4 /WX` 로 받는가        Debug/Release 양쪽
#   2. 단위 테스트가 macOS 와 같은 수를 내는가       블록이 조용히 빠지면 줄어든다
#   3. **실행 파일이 실제로 도는가**                 plugin_smoke (ctest)
#
# 3번이 이 워크플로의 핵심이다. 가짜 `scanimage` 를 세워 detect →
# capabilities → scan 을 끝까지 돌리므로, 프로세스 생성·파이프 교착·
# stdout 오염·토큰 연결이 전부 여기서 드러난다.
#
# `paths:` 로 막아 두었으므로 `negaflow-windows/` 가 바뀌지 않으면 돌지 않는다.
#
# 근거(전부 2026-08-05 확인):
#   windows-latest = Windows Server 2025 + Visual Studio 2026(toolset v145),
#                    CMake 4.4.0, vcpkg 사전 설치(VCPKG_INSTALLATION_ROOT=C:\vcpkg)
#   vcpkg 매니페스트는 CMAKE_SOURCE_DIR 기준으로 찾는다 → `-S negaflow-windows` 면 자동
#   VCPKG_TARGET_TRIPLET 을 안 주면 기본이 x64-windows(동적 CRT)라 LNK2038
#
# SPDX-License-Identifier: GPL-2.0-or-later

name: Windows adapter

on:
  push:
    branches: [main]
    paths: ['negaflow-windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['negaflow-windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MSVC ${{ matrix.config }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Debug 를 같이 돈다. _ITERATOR_DEBUG_LEVEL 불일치는 Debug 에서만
        # 드러나고, CMAKE_MSVC_RUNTIME_LIBRARY 의 제네레이터 식이 정확히
        # 그 경우를 다룬다 — 안 돌리면 그 식이 검증되지 않는다.
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        shell: pwsh
        run: |
          cmake --version
          "vcpkg: $env:VCPKG_INSTALLATION_ROOT"
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" version

      # vcpkg.json 은 negaflow-windows/ 에 있다. `-S negaflow-windows` 가 CMAKE_SOURCE_DIR 을
      # <repo>/windows 로 만들고 vcpkg 툴체인이 거기서 매니페스트를 자동
      # 발견한다 — VCPKG_MANIFEST_DIR 은 필요 없다.
      #
      # **VCPKG_TARGET_TRIPLET 이 이 파일에서 가장 중요한 줄이다.**
      # CMAKE_MSVC_RUNTIME_LIBRARY 가 정적 CRT(MultiThreaded)인데 vcpkg 기본
      # 트리플릿은 동적 CRT 다. 빼면 libtiff/zlib 이 /MD 로 빌드돼
      # LNK2038 "mismatch detected for 'RuntimeLibrary'" 로 링크가 깨진다.
      #   x64-windows-static      CRT 정적 + 라이브러리 정적   ← 이것
      #   x64-windows-static-md   CRT **동적** + 라이브러리 정적
      - name: Configure
        shell: pwsh
        run: >
          cmake -S negaflow-windows -B build
          -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # 체크 수를 로그에 남긴다. macOS 와 다르면 어느 블록이 빠진 것이다
      # (libtiff / RapidJSON 이 선택 의존이라 조용히 건너뛸 수 있다).
      - name: Check count
        shell: pwsh
        run: ./build/${{ matrix.config }}/sane_logic_tests.exe

      # 실행 파일이 실제로 만들어졌는지 확인한다. libtiff 나 RapidJSON 이
      # 빠지면 CMake 가 WARNING 만 내고 넘어가므로, 그때 초록불이 뜨면
      # "빌드는 됐지만 제품이 없는" 상태를 통과시키게 된다.
      - name: Plugin binary exists
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.config }}/negaflow-scanner-sane.exe"
          if (-not (Test-Path $exe)) {
            throw "실행 파일이 만들어지지 않았다: $exe"
          }
          & $exe 2>&1 | Select-Object -First 1

      - name: Upload plugin binary
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-scanner-sane-${{ matrix.config }}-${{ github.sha }}
          path: build/${{ matrix.config }}/negaflow-scanner-sane.exe
          if-no-files-found: error
          retention-days: 7

      # 설정 로그를 남긴다. "RapidJSON 을 찾지 못했다" 같은 WARNING 이
      # 여기 있으면 초록불이어도 검증이 줄어든 것이다.
      - name: Upload configure log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cmake-logs-${{ matrix.config }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/vcpkg-manifest-install.log
          if-no-files-found: ignore
          retention-days: 7
