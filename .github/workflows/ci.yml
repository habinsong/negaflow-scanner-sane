name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Swift and provenance
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Verify provenance
        run: python3 negaflow-mac/scripts/verify-provenance.py
      - name: Verify installer pre-flight check
        # 설치 관리자의 installation_check() 는 설치 전에 도는 JS 다. 여기서 터지거나
        # 조건을 놓치면 사용자는 원인 없는 실패 화면만 보게 되므로 실기 엔진으로 돌려 본다.
        run: bash negaflow-mac/scripts/verify-distribution-script.sh
      - name: Test
        run: swift test --package-path negaflow-mac -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Remove unused runner tap
        run: |
          if brew tap | grep -Fqx aws/tap; then
            brew untap aws/tap
          fi
      - name: Build and install patched Coolscan SANE
        run: bash negaflow-mac/scripts/install-patched-sane.sh

  release-smoke:
    name: Unsigned installer smoke
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Build Apple Silicon and Universal installers
        env:
          NEGAFLOW_INSTALLER_MODE: local
          NEGAFLOW_OVERWRITE_INSTALLER: 1
          NEGAFLOW_INSTALLER_VARIANT: all
        run: bash negaflow-mac/scripts/build-installer.sh
      - name: Verify checksums
        # The lists hold bare file names, so shasum has to run beside the files.
        working-directory: negaflow-mac/.build/release-artifacts
        run: shasum -a 256 -c negaflow-sane-*-mac.sha256
      - name: Upload installer smoke artifacts
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-scanner-sane-installers-${{ github.sha }}
          path: negaflow-mac/.build/release-artifacts/negaflow-sane-*-mac*
          if-no-files-found: error
          retention-days: 14
