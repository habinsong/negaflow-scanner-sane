name: Distribution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notarized-artifacts:
    name: Developer ID signed and notarized artifacts
    runs-on: macos-26
    timeout-minutes: 90
    environment: distribution
    steps:
      - uses: actions/checkout@v7
      - name: Validate required secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.NEGAFLOW_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.NEGAFLOW_DEVELOPER_ID_P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.NEGAFLOW_CODESIGN_IDENTITY }}
          INSTALLER_ID_P12_BASE64: ${{ secrets.NEGAFLOW_INSTALLER_ID_P12_BASE64 }}
          INSTALLER_ID_P12_PASSWORD: ${{ secrets.NEGAFLOW_INSTALLER_ID_P12_PASSWORD }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.NEGAFLOW_INSTALLER_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.NEGAFLOW_NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NEGAFLOW_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NEGAFLOW_NOTARY_ISSUER_ID }}
        run: |
          set +x
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD CODESIGN_IDENTITY \
                      INSTALLER_ID_P12_BASE64 INSTALLER_ID_P12_PASSWORD INSTALLER_SIGN_IDENTITY \
                      NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "missing required distribution secret: $name" >&2
              exit 2
            fi
          done
      - name: Configure signing and notarization keychain
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.NEGAFLOW_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.NEGAFLOW_DEVELOPER_ID_P12_PASSWORD }}
          INSTALLER_ID_P12_BASE64: ${{ secrets.NEGAFLOW_INSTALLER_ID_P12_BASE64 }}
          INSTALLER_ID_P12_PASSWORD: ${{ secrets.NEGAFLOW_INSTALLER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NEGAFLOW_NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NEGAFLOW_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NEGAFLOW_NOTARY_ISSUER_ID }}
        run: |
          set +x
          KEYCHAIN="$RUNNER_TEMP/negaflow-sane-signing.keychain-db"
          APP_P12="$RUNNER_TEMP/developer-id-application.p12"
          INSTALLER_P12="$RUNNER_TEMP/developer-id-installer.p12"
          API_KEY="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode >"$APP_P12"
          printf '%s' "$INSTALLER_ID_P12_BASE64" | base64 --decode >"$INSTALLER_P12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode >"$API_KEY"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security import "$INSTALLER_P12" -k "$KEYCHAIN" -P "$INSTALLER_ID_P12_PASSWORD" \
            -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          xcrun notarytool store-credentials negaflow-sane-ci \
            --key "$API_KEY" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm -f "$APP_P12" "$INSTALLER_P12" "$API_KEY"
      - name: Run release-quality gate
        run: |
          python3 negaflow-mac/scripts/verify-provenance.py
          swift test --package-path negaflow-mac -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          bash negaflow-mac/scripts/install-patched-sane.sh
      - name: Build signed and notarized plug-in release
        env:
          NEGAFLOW_RELEASE_MODE: distribution
          NEGAFLOW_OVERWRITE_RELEASE: 1
          NEGAFLOW_CODESIGN_IDENTITY: ${{ secrets.NEGAFLOW_CODESIGN_IDENTITY }}
          NEGAFLOW_NOTARY_KEYCHAIN_PROFILE: negaflow-sane-ci
        run: bash negaflow-mac/scripts/build-release.sh
      - name: Build signed and notarized installer
        env:
          NEGAFLOW_INSTALLER_MODE: distribution
          NEGAFLOW_OVERWRITE_INSTALLER: 1
          NEGAFLOW_CODESIGN_IDENTITY: ${{ secrets.NEGAFLOW_CODESIGN_IDENTITY }}
          NEGAFLOW_INSTALLER_IDENTITY: ${{ secrets.NEGAFLOW_INSTALLER_SIGN_IDENTITY }}
          NEGAFLOW_NOTARY_KEYCHAIN_PROFILE: negaflow-sane-ci
          NEGAFLOW_INSTALLER_VARIANT: all
        run: bash negaflow-mac/scripts/build-installer.sh
      - name: Verify final artifacts
        # 버전과 변형 이름을 손으로 적지 않는다. 적어 두면 릴리즈마다 낡고, 이 잡은 태그를
        # 밀 때만 도는 탓에 낡은 것을 릴리즈 당일에야 알게 된다.
        run: |
          ARTIFACTS=negaflow-mac/.build/release-artifacts
          VERSION="$(plutil -extract pluginVersion raw negaflow-mac/manifest.json)"
          (
            cd "$ARTIFACTS"
            shasum -a 256 -c *-SHA256SUMS.txt
          )
          bash negaflow-mac/scripts/verify-release.sh "$ARTIFACTS"
          verify_installer() {
            NEGAFLOW_INSTALLER_MODE=distribution \
              bash negaflow-mac/scripts/verify-installer.sh \
              "$ARTIFACTS/negaflow-scanner-sane-$VERSION-$1-installer.pkg" \
              "$ARTIFACTS/negaflow-scanner-sane-$VERSION-$1-installer.dmg" \
              "$2" \
              "$3"
          }
          verify_installer opticfilm-macos14-arm64 arm64 standard
          verify_installer opticfilm-macos14-universal universal standard
          verify_installer macos26-arm64 arm64 coolscan
          verify_installer macos26-universal universal coolscan
      - name: Upload notarized artifacts
        uses: actions/upload-artifact@v7
        with:
          name: negaflow-scanner-sane-notarized-${{ github.sha }}
          path: negaflow-mac/.build/release-artifacts/*
          if-no-files-found: error
          retention-days: 30
